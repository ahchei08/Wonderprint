name: Build Mac
on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false
      sign-and-notarize:
        description: 'Sign and notarize the DMG (for release, need valid certs)'
        type: boolean
        default: false
      create-dmg-only:
        description: 'Only create DMG without signing/notarization (for test)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_mac_cache:
    name: Check Mac Dependencies Cache
    runs-on: macos-14
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout Code (with LFS)
        uses: actions/checkout@v5
        with:
          lfs: 'true'
          sparse-checkout-cone-mode: false

      - name: Set Mac Cache Variables
        id: set_outputs
        env:
          dep-folder-name: ''  # MacOS uses empty folder name per build_check_cache.yml
        run: |
          CACHE_KEY="macos-14-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}"
          CACHE_PATH="${{ github.workspace }}/deps/build${{ env.dep-folder-name }}"
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "cache-path=$CACHE_PATH" >> $GITHUB_OUTPUT
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV
          echo "CACHE_PATH=$CACHE_PATH" >> $GITHUB_ENV

      - name: Load Dependencies Cache (Lookup Only)
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true

  build_mac_deps:
    name: Build Mac Dependencies
    needs: [check_mac_cache]
    runs-on: macos-14
    if: ${{ !cancelled() && (inputs.build-deps-only || needs.check_mac_cache.outputs.valid-cache != 'true' || inputs.force-build) }}
    env:
      date: ${{ github.sha }}
    steps:
      - name: Checkout Full Code (with LFS)
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ${{ needs.check_mac_cache.outputs.cache-path }}
          key: ${{ needs.check_mac_cache.outputs.cache-key }}

      - name: Install CMake 3.28.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install Mac Dependency Tools (brew)
        run: |
          brew install automake texinfo libtool
          brew list
          brew uninstall --ignore-dependencies zstd

      - name: Build Mac Dependencies universal
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -dx -a universal -t 10.15 -1
          for arch in arm64 x86_64; do
            (cd "${{ github.workspace }}/deps/build/${arch}" && \
            find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +)
          done
          brew install zstd

      - name: Save Dependencies Cache (Update New Build)
        uses: actions/cache@v4
        if: ${{ !cancelled() && !inputs.build-deps-only && needs.check_mac_cache.outputs.valid-cache != 'true' }}
        with:
          path: ${{ needs.check_mac_cache.outputs.cache-path }}
          key: ${{ needs.check_mac_cache.outputs.cache-key }}

      - name: Exit if Only Build Dependencies
        if: ${{ inputs.build-deps-only }}
        run: exit 0

  build_mac_main:
    name: Build & Package Mac (universal)
    needs: [check_mac_cache, build_mac_deps]
    runs-on: macos-14
    if: ${{ !cancelled() && !inputs.build-deps-only }}
    env:
      ver: ${{ github.sha }}-nightly
      date: ${{ github.sha }}
      BUILD_DIR: ${{ github.workspace }}/build/universal
      KEYCHAIN_PWD: "12345678"
      DEPS_DIR: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
      ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}
    steps:
      - name: Checkout Code (for main build)
        uses: actions/checkout@v5
        with:
          lfs: 'true'
          fetch-depth: 1

      - name: Restore Dependencies Cache for Main Build
        id: restore_main_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_DIR }}
          key: ${{ needs.check_mac_cache.outputs.cache-key }}
          fail-on-cache-miss: false

      - name: Print Cache Hit Status
        run: |
          if [ "${{ steps.restore_main_cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 依赖缓存恢复成功，路径：${{ env.DEPS_DIR }}"
          else
            echo "⚠️  依赖缓存未命中，将使用本地构建产物"
          fi

      - name: Free Disk Space & Install Tools
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1
          brew install libtool zstd
          brew list
          mkdir -p ${{ env.BUILD_DIR }}

      - name: Get version and date
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Build OrcaSlicer Main Program
        working-directory: ${{ github.workspace }}
        run: |
          export BOOST_ROOT="${{ env.DEPS_DIR }}"
          export Boost_DIR="${{ env.DEPS_DIR }}/lib/cmake/Boost-1.84.0"
          export CMAKE_PREFIX_PATH="${{ env.DEPS_DIR }}:${CMAKE_PREFIX_PATH}"
          ./build_release_macos.sh -s -n -x -a universal -t 10.15 -1
          
          TARGET_APP_PATH="${{ env.BUILD_DIR }}/OrcaSlicer/OrcaSlicer.app"
          TARGET_EXEC_PATH="${TARGET_APP_PATH}/Contents/MacOS/OrcaSlicer"
          
          if [ -f "$TARGET_EXEC_PATH" ]; then
            echo "=== 验证主程序架构 ==="
            lipo -info "$TARGET_EXEC_PATH"
            if ! lipo -info "$TARGET_EXEC_PATH" | grep -q "arm64 x86_64"; then
              echo "错误：主程序不是 universal 架构！"
              exit 1
            fi
          else
            echo "错误：未找到可执行文件：$TARGET_EXEC_PATH"
            exit 1
          fi

      - name: Import Provisioning Profile
        if: ${{ inputs.sign-and-notarize }}
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p $PROFILE_DIR
          echo "$PROFILE_BASE64" | base64 --decode > $PROFILE_DIR/orcaslicer_profile.provisionprofile

      - name: Sign & Notarize App
        if: ${{ inputs.sign-and-notarize }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.WONDERMAKERDIST }}
          P12_PASSWORD: ${{ secrets.MAC_P12_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: "752C3QMAKU"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p ${{ env.KEYCHAIN_PWD }} $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p ${{ env.KEYCHAIN_PWD }} $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P $P12_PASSWORD -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ${{ env.KEYCHAIN_PWD }} $KEYCHAIN_PATH

          CERTIFICATE_ID=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | awk '{print $2}' | head -n1)
          echo "使用的证书ID：$CERTIFICATE_ID"
          if [ -z "$CERTIFICATE_ID" ]; then
            echo "错误：未找到有效的签名证书！"
            exit 1
          fi

          TARGET_APP="${{ env.BUILD_DIR }}/OrcaSlicer/OrcaSlicer.app"
          codesign --deep --force --verbose --options runtime --timestamp \
            --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements \
            --sign "$CERTIFICATE_ID" $TARGET_APP

          VALIDATOR_APP="${{ env.BUILD_DIR }}/OrcaSlicer/OrcaSlicer_profile_validator.app"
          if [ -d "$VALIDATOR_APP" ] && [ -f "$VALIDATOR_APP/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            codesign --deep --force --verbose --options runtime --timestamp \
              --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements \
              --sign "$CERTIFICATE_ID" $VALIDATOR_APP
          fi

          DMG_SRC="${{ env.BUILD_DIR }}/OrcaSlicer_dmg"
          mkdir -p $DMG_SRC && rm -rf $DMG_SRC/*
          cp -R $TARGET_APP $DMG_SRC/
          ln -sfn /Applications $DMG_SRC/Applications
          DMG_NAME="OrcaSlicer_Mac_universal_${{ env.ver }}_signed.dmg"
          hdiutil create -volname "OrcaSlicer" -srcfolder $DMG_SRC -ov -format UDZO $DMG_NAME
          codesign --deep --force --verbose --options runtime --timestamp \
            --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements \
            --sign "$CERTIFICATE_ID" $DMG_NAME

          VALIDATOR_DMG_NAME=""
          if [ -d "$VALIDATOR_APP" ]; then
            VALIDATOR_DMG_SRC="${{ env.BUILD_DIR }}/OrcaSlicer_profile_validator_dmg"
            mkdir -p $VALIDATOR_DMG_SRC && rm -rf $VALIDATOR_DMG_SRC/*
            cp -R $VALIDATOR_APP $VALIDATOR_DMG_SRC/
            ln -sfn /Applications $VALIDATOR_DMG_SRC/Applications
            VALIDATOR_DMG_NAME="OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_signed.dmg"
            hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder $VALIDATOR_DMG_SRC -ov -format UDZO $VALIDATOR_DMG_NAME
            codesign --deep --force --verbose --options runtime --timestamp \
              --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements \
              --sign "$CERTIFICATE_ID" $VALIDATOR_DMG_NAME
          fi

          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PASSWORD"
          xcrun notarytool submit "$DMG_NAME" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "$DMG_NAME"

          if [ -n "$VALIDATOR_DMG_NAME" ]; then
            xcrun notarytool submit "$VALIDATOR_DMG_NAME" --keychain-profile "notarytool-profile" --wait
            xcrun stapler staple "$VALIDATOR_DMG_NAME"
          fi

      - name: Create DMG (Without Notarization)
        if: ${{ inputs.create-dmg-only }}
        run: |
          TARGET_APP="${{ env.BUILD_DIR }}/OrcaSlicer/OrcaSlicer.app"
          DMG_SRC="${{ env.BUILD_DIR }}/OrcaSlicer_dmg"
          mkdir -p $DMG_SRC && rm -rf $DMG_SRC/*
          cp -R $TARGET_APP $DMG_SRC/
          ln -sfn /Applications $DMG_SRC/Applications
          DMG_NAME="OrcaSlicer_Mac_universal_${{ env.ver }}_test.dmg"
          hdiutil create -volname "OrcaSlicer" -srcfolder $DMG_SRC -ov -format UDZO $DMG_NAME

          VALIDATOR_APP="${{ env.BUILD_DIR }}/OrcaSlicer/OrcaSlicer_profile_validator.app"
          if [ -d "$VALIDATOR_APP" ]; then
            VALIDATOR_DMG_SRC="${{ env.BUILD_DIR }}/OrcaSlicer_profile_validator_dmg"
            mkdir -p $VALIDATOR_DMG_SRC && rm -rf $VALIDATOR_DMG_SRC/*
            cp -R $VALIDATOR_APP $VALIDATOR_DMG_SRC/
            ln -sfn /Applications $VALIDATOR_DMG_SRC/Applications
            VALIDATOR_DMG_NAME="OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_test.dmg"
            hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder $VALIDATOR_DMG_SRC -ov -format UDZO $VALIDATOR_DMG_NAME
          fi

      - name: Upload Signed & Notarized DMG
        if: ${{ inputs.sign-and-notarize }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_Mac_universal_${{ env.ver }}_signed
          path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}_signed.dmg

      - name: Upload Test DMG (Without Notarization)
        if: ${{ inputs.create-dmg-only }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_Mac_universal_${{ env.ver }}_test
          path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}_test.dmg

      - name: Upload Signed Profile Validator DMG
        if: ${{ inputs.sign-and-notarize }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_signed
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_signed.dmg
          if-no-files-found: warn

      - name: Upload Test Profile Validator DMG
        if: ${{ inputs.create-dmg-only }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_test
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_test.dmg
          if-no-files-found: warn

      - name: Deploy Nightly Release (Main Branch)
        if: ${{ inputs.sign-and-notarize && github.repository == 'ahchei08/Wonderprint' && github.ref == 'refs/heads/main' }}
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/ahchei08/Wonderprint/releases/271695561/assets{?name,label}
          release_id: 271695561
          asset_path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}_signed.dmg
          asset_name: WonderMaker_Mac_universal_nightly.dmg
          asset_content_type: application/octet-stream
          max_releases: 1

      - name: Deploy Profile Validator Nightly
        if: ${{ inputs.sign-and-notarize && github.repository == 'ahchei08/Wonderprint' && github.ref == 'refs/heads/main' }}
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/ahchei08/Wonderprint/releases/271695561/assets{?name,label}
          release_id: 271695561
          asset_path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}_signed.dmg
          asset_name: OrcaSlicer_profile_validator_Mac_universal_nightly.dmg
          asset_content_type: application/octet-stream
          max_releases: 1
          if-no-files-found: warn