name: Wonderprint macOS

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload the built DMG to a GitHub Release in this repository"
        type: boolean
        default: false
      sign_and_notarize:
        description: "Sign and notarize the DMG with Apple credentials"
        type: boolean
        default: false
      release_tag:
        description: "Optional release tag override (defaults to v<version.inc>)"
        type: string
        default: ""
      release_name:
        description: "Optional release title override"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    name: Build macOS DMG
    runs-on: macos-14
    env:
      BUILD_DIR: ${{ github.workspace }}/build/universal
      BUILD_APP: ${{ github.workspace }}/build/universal/Wonderprint-Orca/Wonderprint-Orca.app
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: "true"

      - name: Restore dependency cache
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build
          key: macos-14-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          version_label="V${ver_pure}"

          release_tag="${{ inputs.release_tag }}"
          release_name="${{ inputs.release_name }}"

          if [ -z "$release_tag" ]; then
            release_tag="v${ver_pure}"
          fi

          if [ -z "$release_name" ]; then
            release_name="Wonderprint-Orca ${ver_pure}"
          fi

          if [ "${{ inputs.sign_and_notarize }}" = "true" ]; then
            dmg_name="Wonderprint-Orca_Mac_universal_${version_label}.dmg"
          else
            dmg_name="Wonderprint-Orca_Mac_universal_${version_label}_unsigned.dmg"
          fi

          artifact_name="${dmg_name%.dmg}"

          {
            echo "version_label=$version_label"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "dmg_name=$dmg_name"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install libtool

      - name: Build macOS dependencies
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install automake texinfo libtool
          brew uninstall --ignore-dependencies zstd || true
          ./build_release_macos.sh -dx -a universal -t 10.15 -1
          for arch in arm64 x86_64; do
            (
              cd "${GITHUB_WORKSPACE}/deps/build/${arch}" &&
              find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +
            )
          done
          brew install zstd

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -hI /
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /

      - name: Build universal Wonderprint app
        shell: bash
        env:
          ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies zstd || true
          trap 'brew install zstd || true' EXIT
          mkdir -p "${GITHUB_WORKSPACE}/deps/build"
          ./build_release_macos.sh -s -x -a universal -t 10.15 -1

      - name: Inspect built app
        shell: bash
        run: |
          set -euo pipefail
          test -d "${BUILD_APP}"
          lipo -info "${BUILD_APP}/Contents/MacOS/Wonderprint-Orca"

      - name: Package unsigned DMG
        if: ${{ !inputs.sign_and_notarize }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package_macos_dmg.sh \
            "${BUILD_APP}" \
            "${BUILD_DIR}/${{ steps.meta.outputs.dmg_name }}" \
            "Wonderprint-Orca"

      - name: Sign, notarize, and package DMG
        if: ${{ inputs.sign_and_notarize }}
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          LEGACY_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.WONDERMAKERDIST }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          LEGACY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MAC_P12_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/sign_notarize_macos.sh \
            "${BUILD_APP}" \
            "${BUILD_DIR}/${{ steps.meta.outputs.dmg_name }}" \
            "Wonderprint-Orca"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ env.BUILD_DIR }}/${{ steps.meta.outputs.dmg_name }}
          if-no-files-found: error

      - name: Publish DMG to GitHub Release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          DMG_PATH: ${{ env.BUILD_DIR }}/${{ steps.meta.outputs.dmg_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}"
            gh release upload "${RELEASE_TAG}" "${DMG_PATH}" --clobber
          else
            notes="Automated macOS build for Wonderprint from ${GITHUB_REF_NAME}."
            if [ "${{ inputs.sign_and_notarize }}" != "true" ]; then
              notes="${notes}"$'\n\n'"This DMG is unsigned and intended for testing or manual distribution."
            fi
            gh release create "${RELEASE_TAG}" "${DMG_PATH}" --title "${RELEASE_NAME}" --notes "${notes}"
          fi

      - name: Summarize build outputs
        shell: bash
        run: |
          {
            echo "## Wonderprint macOS build"
            echo
            echo "- Version: \`${{ steps.meta.outputs.version_label }}\`"
            echo "- DMG: \`${{ steps.meta.outputs.dmg_name }}\`"
            echo "- Signed/notarized: \`${{ inputs.sign_and_notarize }}\`"
            echo "- Published to release: \`${{ inputs.publish_release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
